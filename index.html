<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080d"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg">
<title>AnimeHub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080d;color:#f7f7fb;font-family:system-ui,-apple-system,sans-serif}button,input{font:inherit}button{border:0;border-radius:14px;padding:11px 14px;background:#1b1b26;color:#fff}.app{max-width:900px;margin:auto;padding:18px 16px 100px}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800}.brand span{color:#a855f7}.search{display:flex;gap:8px;margin:18px 0}.search input{flex:1;background:#15151e;border:1px solid #292936;border-radius:14px;padding:13px;color:#fff}.hero{padding:24px;border-radius:24px;background:linear-gradient(135deg,#171225,#11111b);border:1px solid #29203d;margin-bottom:22px}.hero h1{font-size:34px;line-height:1.05;margin:8px 0}.hero p,.muted{color:#a7a7b5}.primary{background:#8b5cf6}.section-head{display:flex;justify-content:space-between;align-items:center}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 16px}.chip{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#12121a;border:1px solid #242430;border-radius:18px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#20202b}.card div{padding:10px}.card b{display:block;font-size:14px}.card small{display:block;color:#9999a8;margin-top:5px}.empty{padding:20px;border:1px dashed #30303b;border-radius:16px;color:#9999a8}nav{position:fixed;bottom:0;left:0;right:0;background:#0d0d14ee;backdrop-filter:blur(14px);border-top:1px solid #252530;display:flex;justify-content:center;gap:8px;padding:10px;z-index:5}nav button{background:transparent;min-width:70px;font-size:20px}nav small{display:block;font-size:11px;color:#aaa}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:flex-end;z-index:10}.sheet{width:100%;max-height:88vh;overflow:auto;background:#111119;border-radius:24px 24px 0 0;padding:22px}.sheet img{width:130px;border-radius:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.review{padding:12px;background:#181821;border-radius:12px;margin:8px 0}.loader{margin:18px auto;width:28px;height:28px;border:3px solid #333;border-top-color:#a855f7;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}#splash{position:fixed;inset:0;background:#08080d;display:grid;place-content:center;text-align:center;z-index:20}#splash img{width:90px;margin:auto}.splash-title{font-size:28px;font-weight:800}.splash-title span{color:#a855f7}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:48px}}
</style>
</head>
<body>
<div id="splash"><img src="./icons/icon.svg"><div class="splash-title">Anime<span>Hub</span></div><div class="loader"></div></div>
<div class="app">
<header><div class="brand">🍥 Anime<span>Hub</span></div><button id="profile">●</button></header>
<div class="search"><input id="q" placeholder="Search anime..."><button id="go">⌕</button></div>
<section class="hero"><small>ANIMEHUB</small><h1>Find your next obsession.</h1><p>Discover anime, track episodes and build your watchlist.</p><div class="actions"><button class="primary" id="explore">🔥 Explore</button><button id="mylist">▣ My List</button></div></section>
<section><div class="section-head"><h2 id="heading">Popular Anime</h2><span id="status"></span></div><div class="chips"><button class="chip" data-genre="ACTION">Action</button><button class="chip" data-genre="FANTASY">Fantasy</button><button class="chip" data-genre="ROMANCE">Romance</button><button class="chip" data-genre="COMEDY">Comedy</button><button class="chip" data-genre="ADVENTURE">Adventure</button></div><div id="grid" class="grid"></div></section>
<section><h2>Continue Watching</h2><div id="continue" class="empty">Nothing in progress yet.</div></section>
</div>
<nav><button id="home">⌂<small>Home</small></button><button id="discover">⌕<small>Discover</small></button><button id="navlist">▣<small>My List</small></button><button id="navprofile">●<small>Profile</small></button></nav>
<div id="modal" class="modal"></div>
<script>
const API="https://graphql.anilist.co",Q=`query($page:Int,$perPage:Int,$search:String,$genre:Genre){Page(page:$page,perPage:$perPage){media(type:ANIME,search:$search,genre:$genre,sort:POPULARITY_DESC){id title{romaji english}coverImage{large extraLarge}description genres averageScore episodes status seasonYear format}}}`;
let saved=JSON.parse(localStorage.ah_saved||"[]"),progress=JSON.parse(localStorage.ah_progress||"{}"),$=s=>document.querySelector(s);
function esc(s){return(s||"").replace(/<[^>]+>/g,"")}
async function api(v){let r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:Q,variables:v})});if(!r.ok)throw Error();return(await r.json()).data.Page.media}
function render(items){$("#grid").innerHTML=items.map(a=>`<article class="card" data-id="${a.id}"><img src="${a.coverImage?.large||""}"><div><b>${esc(a.title.english||a.title.romaji)}</b><small>${a.format||""} · ${a.seasonYear||""} · ★ ${a.averageScore?(a.averageScore/10).toFixed(1):"—"}</small></div></article>`).join("");document.querySelectorAll(".card").forEach(c=>c.onclick=()=>details(items.find(a=>a.id==c.dataset.id)))}
async function load(v={},h="Popular Anime"){$("#heading").textContent=h;$("#status").textContent="Loading…";$("#grid").innerHTML='<div class="empty">Loading live anime…</div>';try{render(await api({page:1,perPage:20,...v}));$("#status").textContent="Live"}catch{$("#status").textContent="Offline";$("#grid").innerHTML='<div class="empty">Live anime data is unavailable right now.</div>'}}
function details(a){$("#modal").style.display="flex";$("#modal").innerHTML=`<div class="sheet"><img src="${a.coverImage?.extraLarge||""}"><h2>${esc(a.title.english||a.title.romaji)}</h2><p class="muted">${a.format||""} · ${a.status||""} · ${a.episodes||"?"} episodes · ${a.seasonYear||""}</p><p>${esc(a.description)||"No synopsis available."}</p><p class="muted">${(a.genres||[]).join(" · ")}</p><div class="actions"><button class="primary" id="track">▶ Track episode</button><button id="save">＋ My List</button></div><div class="actions"><button id="stream">Find legal streaming</button><button id="close">Close</button></div></div>`;$("#close").onclick=close;$("#save").onclick=()=>{if(!saved.some(x=>x.id===a.id))saved.push({id:a.id,name:a.title.english||a.title.romaji});localStorage.ah_saved=JSON.stringify(saved);alert("Added to My List")};$("#track").onclick=()=>{let e=prompt("Episode number","1");if(e){progress[a.id]={name:a.title.english||a.title.romaji,episode:Number(e),updated:Date.now()};localStorage.ah_progress=JSON.stringify(progress);renderContinue();close()}};$("#stream").onclick=()=>open("https://www.google.com/search?q="+encodeURIComponent((a.title.english||a.title.romaji)+" official streaming"),"_blank")}
function close(){$("#modal").style.display="none"}function renderContinue(){let v=Object.values(progress).sort((a,b)=>b.updated-a.updated);$("#continue").innerHTML=v.length?v.map(x=>`<div class="review"><b>${esc(x.name)}</b><small>Episode ${x.episode}</small></div>`).join(""):"Nothing in progress yet."}
function openList(){$("#modal").style.display="flex";$("#modal").innerHTML=`<div class="sheet"><h2>▣ My List</h2>${saved.length?saved.map(x=>`<div class="review"><b>${esc(x.name)}</b></div>`).join(""):'<p class="muted">Your list is empty.</p>'}<button id="close">Close</button></div>`;$("#close").onclick=close}
function profile(){$("#modal").style.display="flex";$("#modal").innerHTML='<div class="sheet"><h2>● Profile</h2><p class="muted">Profile and account sync can be connected to a production auth provider.</p><button id="close">Close</button></div>';$("#close").onclick=close}
$("#go").onclick=()=>load({search:$("#q").value.trim()},"Search Results");$("#q").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};$("#explore").onclick=()=>load();$("#mylist").onclick=openList;$("#navlist").onclick=openList;$("#profile").onclick=profile;$("#navprofile").onclick=profile;$("#home").onclick=()=>load();$("#discover").onclick=()=>$("#q").focus();document.querySelectorAll("[data-genre]").forEach(b=>b.onclick=()=>load({genre:b.dataset.genre},b.textContent+" Anime"));$("#modal").onclick=e=>{if(e.target.id==="modal")close()};renderContinue();load();setTimeout(()=>$("#splash").style.display="none",700);
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script>
</body></html>
